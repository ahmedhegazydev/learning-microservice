spring.application.name=property-service

# Local PostgreSQL from compose.yaml (host port 5433; 5432 is taken by a local install).
# Set DB_PORT=5432 to use the local install instead.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/properties
spring.datasource.username=property_app
spring.datasource.password=property_app

# Flyway owns the schema; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a database connection open for the whole web request
spring.jpa.open-in-view=false
