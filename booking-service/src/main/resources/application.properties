spring.application.name=booking-service
server.port=8081

# Its own database: property-service's tables are never read from here.
# Local PostgreSQL from compose.yaml (host port 5434); set DB_PORT=5432 for a local install.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5434}/bookings
spring.datasource.username=booking_app
spring.datasource.password=booking_app

# Flyway owns the schema; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a database connection open for the whole web request
spring.jpa.open-in-view=false

# The only way to reach property data is through its API
property-service.url=${PROPERTY_SERVICE_URL:http://localhost:8080}
